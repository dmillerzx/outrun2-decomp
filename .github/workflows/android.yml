name: Android APK

on:
  push:
    branches: [ main, android ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install Ninja & CMake
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Build Native Engine (CMake & Ninja)
        run: |
          cmake -B build-android -S android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja
          ninja -C build-android
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build-android/libmain.so android/app/src/main/jniLibs/arm64-v8a/libmain.so
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip android/app/src/main/jniLibs/arm64-v8a/libmain.so

      - name: Assemble Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: outrun2-c2c-android-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release Preview
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
