plugins {
    id 'com.android.application'
}

android {
    namespace 'org.outrun2.c2c'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'org.outrun2.c2c'
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets.main {
        java.srcDirs = ['src/main/java']
        jniLibs.srcDirs = ['src/main/jniLibs']
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
}
